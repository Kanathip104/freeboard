<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>IoT-104 Dashboard</title>
    <style>
        body { font-family: sans-serif; background: #f4f4f9; text-align: center; padding: 20px; }
        .card { background: white; padding: 20px; margin: 10px auto; width: 300px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    </style>
</head>
<body>
    <h1>IoT-104 Sensor Dashboard</h1>
    <div class="card">
        <h3>อุณหภูมิ (Temperature)</h3>
        <p id="temp">กำลังโหลด...</p>
    </div>
    <div class="card">
        <h3>ความชื้น (Humidity)</h3>
        <p id="humi">กำลังโหลด...</p>
    </div>
</body>
</html>
